name: Release plugin

# 浏览器插件发布：打 tag（v*）时构建 Chrome / Firefox 包并上传到 Release，
# 手动触发时只产出 artifacts，方便本地验证。
#
# 发布流程：
#   pnpm release:patch        # 升版本 + 打 tag + push（见 package.json）
# 或者手动：
#   git tag v1.5.11 && git push origin v1.5.11
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 生成 changelog 要读完整历史和 tag，默认的 shallow clone 拿不到
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tag 和 package.json 版本对不上时，产出的 zip 名字与实际版本不一致，
      # 与其发布一个错版本，不如早点失败
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 里的 ${expected} 不一致"
            exit 1
          fi
          echo "版本一致：${expected}"

      - name: Lint
        run: pnpm lint:check

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Build Chrome package
        run: pnpm build:plugin

      - name: Build Firefox package
        run: pnpm zip:firefox

      - name: Build userscript
        run: pnpm build:script

      # 油猴的升级靠 @updateURL 定期回拉：地址必须永久稳定，版本号只写在文件内。
      # 这里先确认构建产物没把地址或版本写错，再进入打包流程。
      - name: Verify userscript metadata
        run: |
          version="$(node -p "require('./package.json').version")"
          meta="$(sed -n 's|^// @version *||p' packages/script/dist/index.user.js | head -1 | tr -d '[:space:]')"
          if [ "$meta" != "$version" ]; then
            echo "::error::userscript @version=${meta} 与 package.json=${version} 不一致"
            exit 1
          fi
          url="https://raw.githubusercontent.com/all-search/all-search/release/index.user.js"
          if ! grep -q "@updateURL *$url" packages/script/dist/index.user.js; then
            echo "::error::@updateURL 不是稳定地址，会导致老用户收不到更新"
            exit 1
          fi
          echo "userscript OK：v${version}，更新地址 ${url}"

      # 产物默认落在 packages/plugin/.output（隐藏目录），而 upload-artifact@v4 的
      # include-hidden-files 默认为 false，会直接报 "No files were found"，
      # 所以先拷到普通目录再上传。
      - name: Collect packages
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-artifacts
          cp packages/plugin/.output/all-search-*.zip dist-artifacts/
          # index.user.js 用于 releases/latest/download 的稳定地址，另存一份带版本号的归档
          cp packages/script/dist/index.user.js dist-artifacts/index.user.js
          cp packages/script/dist/index.user.js "dist-artifacts/all-search-${version}.user.js"
          ls -lh dist-artifacts

      # 顺带保留 AMO 的 sources 包（all-searchplugin-*-sources.zip），方便提审时下载
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: all-search-plugin
          path: dist-artifacts/*
          if-no-files-found: error

      # 用仓库自己的 Conventional Commits 生成正文，替代 GitHub 的 auto notes
      # （我们直接推 master、不开 PR，auto notes 只会产出一条 compare 链接）
      - name: Generate release notes
        run: node scripts/changelog.mjs --version "${GITHUB_REF_NAME}" --out release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 插件只挂两个包（sources.zip 给 AMO 审核用，不放进 Release）；
          # 用户脚本挂固定名 + 版本号归档两份
          files: |
            dist-artifacts/all-search-*.zip
            dist-artifacts/index.user.js
            dist-artifacts/all-search-*.user.js
          body_path: release-notes.md
