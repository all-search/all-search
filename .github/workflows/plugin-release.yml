name: Release plugin

# 浏览器插件发布：打 tag（v*）时构建 Chrome / Firefox 包并上传到 Release，
# 手动触发时只产出 artifacts，方便本地验证。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build Chrome package
        run: pnpm build:plugin

      - name: Build Firefox package
        run: pnpm zip:firefox

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: all-search-plugin
          path: packages/plugin/.output/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/plugin/.output/*.zip
          generate_release_notes: true
