name: CI

# 质量门禁：lint / 类型 / 单测 / e2e（离线可跑的两个场景）/ 产物与体积预算
#
# 为什么要有它：`gh-page.yml` 和 `script-release.yml` 都是 push master 就发布，
# 之前没有任何检查；一条断言写错也可能直接发到线上。
on:
  pull_request:
  push:
    branches: ['master']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  e2e:
    name: e2e (userscript + config)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 只跑不需要 --load-extension 的两个场景：
      # Chrome 137+ 已移除该 flag，plugin / selection 只能在 Windows + Edge 上跑。
      - name: e2e
        run: pnpm e2e --only=userscript,config
        env:
          E2E_CHANNEL: chrome

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/*.png
          retention-days: 7

  artifacts:
    name: build artifacts + size budget
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 三端产物都真的能构建出来：Firefox 包平时没人打，坏了只在发版当天暴露
      - name: Build userscript
        run: pnpm build:script

      - name: Build options
        run: pnpm build:options

      - name: Build plugin (chrome)
        run: pnpm build:plugin

      - name: Build plugin (firefox)
        run: pnpm zip:firefox

      - name: Check artifacts & first-load budget
        run: node scripts/check-artifacts.mjs
